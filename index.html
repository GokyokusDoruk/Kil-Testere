<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24180f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kıl Testere</title>
<style>
  :root {
    --ink: #f7ecdc;
    --ink-dim: #cdb89c;
    --panel: rgba(36, 25, 17, 0.82);
    --panel-solid: #2c1f15;
    --line: rgba(255, 225, 185, 0.14);
    --accent: #eaa95c;
    --accent-ink: #2a1a0c;
    --good: #93d48c;
    --warn: #f1c75e;
    --bad: #ec7d63;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  html, body { margin: 0; height: 100%; background: #24180f; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.paint canvas#c { cursor: none; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(10px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal));
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: linear-gradient(rgba(20,13,8,.75), rgba(20,13,8,0));
  }
  .lvl { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .lvl span { font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .lvl b { font-size: 18px; font-weight: 650; white-space: nowrap; }
  .stats { display: flex; gap: 6px; margin-left: auto; margin-right: auto; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 10px 5px; min-width: 62px; text-align: center; position: relative; overflow: hidden;
  }
  .chip small { display: block; font-size: 10px; color: var(--ink-dim); letter-spacing: .05em; text-transform: uppercase; }
  .chip span { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .chip .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(255,255,255,.06); }
  .chip .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .btns { display: flex; gap: 6px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; pointer-events: auto; touch-action: manipulation;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .4; cursor: default; }
  .btns button { width: 40px; height: 40px; font-size: 18px; }
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px calc(14px + var(--sar)) calc(14px + var(--sab)) calc(14px + var(--sal));
    display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  }
  .rot { width: 66px; height: 66px; border-radius: 50%; font-size: 30px; line-height: 1; }
  .rot.held { background: rgba(234,169,92,.35); }
  #bFinish { height: 48px; padding: 0 22px; font-size: 16px; font-weight: 650; }
  #bFinish.ready { background: var(--accent); color: var(--accent-ink); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(234,169,92,.18); } }
  #brushes { display: none; gap: 8px; align-items: center; }
  #brushes button { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  #brushes button i { display: block; border-radius: 50%; background: var(--ink); }
  #brushes button.sel { background: rgba(234,169,92,.32); border-color: var(--accent); }
  body.paint #brushes { display: flex; }
  body.paint .rot { display: none; }
  #toast {
    position: absolute; left: 50%; bottom: calc(92px + var(--sab)); transform: translate(-50%, 20px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    display: flex; gap: 10px; align-items: center; opacity: 0; transition: .35s; pointer-events: none;
    max-width: calc(100vw - 40px); font-size: 14px;
  }
  body.paint #toast { bottom: auto; top: calc(80px + var(--sat)); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #toast button { padding: 6px 12px; font-size: 13px; white-space: nowrap; }

  /* ---------- Sipariş paneli (sağ üst) ---------- */
  #goal {
    position: absolute; right: calc(12px + var(--sar)); top: 64px; width: 136px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px 8px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  #goal small { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
  #goal canvas { width: 118px; height: 96px; display: block; margin: 3px auto 5px; }
  #goalSw { display: flex; flex-wrap: wrap; gap: 3px 7px; justify-content: center; font-size: 11px; line-height: 1.2; }
  #goalSw span { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
  #goalSw i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.45); }
  #goalSw { flex-direction: column; align-items: flex-start; }
  .rec { display: inline-flex; gap: 1px; margin-left: 2px; opacity: .9; }
  .rec b { width: 6px; height: 6px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.4); }
  .sw .rec b { width: 8px; height: 8px; }
  .sw .eq { color: var(--ink-dim); font-size: 12px; }
  a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; pointer-events: auto; }
  .btns a.btn { width: 40px; height: 40px; font-size: 18px; }
  .menuTop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .menuTop button, .menuTop a.btn { height: 38px; padding: 0 14px; font-size: 14px; font-weight: 600; }
  @media (max-width: 620px) {
    .stats { order: 3; width: 100%; justify-content: space-between; margin: 0; }
    .chip { flex: 1; min-width: 0; padding: 3px 4px 5px; }
    .chip span { font-size: 15px; }
    .btns { margin-left: auto; }
    #goal { width: 100px; padding: 4px 5px 6px; }
    #goal canvas { width: 86px; height: 70px; }
    #goalSw { font-size: 10px; }
    #brushes button { width: 46px; height: 46px; }
  }

  /* ---------- Overlay cards ---------- */
  #overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(18, 11, 6, .55); opacity: 0; pointer-events: none; transition: opacity .3s;
    padding: calc(16px + var(--sat)) 16px calc(16px + var(--sab));
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: var(--panel-solid); border: 1px solid var(--line); border-radius: 20px;
    width: min(440px, 100%); max-height: 100%; overflow: auto; padding: 22px 22px 18px; box-sizing: border-box;
    box-shadow: 0 24px 60px rgba(0,0,0,.45); text-align: center;
    transform: translateY(10px) scale(.98); transition: transform .35s;
  }
  .card.wide { width: min(720px, 100%); }
  #overlay.show .card { transform: none; }
  .kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
  .card h2 { margin: 4px 0 8px; font-size: 26px; }
  .card p { margin: 6px 0 12px; color: var(--ink-dim); line-height: 1.45; font-size: 15px; }
  .card img.prev { width: 150px; height: 122px; margin: 4px auto 2px; display: block; }
  .sw { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 4px; }
  .sw span { display: inline-flex; gap: 4px; align-items: center; }
  .sw i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.45); }
  .pars { display: flex; gap: 8px; justify-content: center; margin: 8px 0 12px; flex-wrap: wrap; }
  .pars div { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .controls { font-size: 13px; color: var(--ink-dim); line-height: 1.6; margin-bottom: 14px; }
  .controls kbd { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: inherit; color: var(--ink); }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .row button { flex: 1; height: 48px; font-size: 16px; font-weight: 600; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .stars { font-size: 46px; letter-spacing: 6px; line-height: 1; margin: 2px 0 4px; }
  .stars i { font-style: normal; color: rgba(255,255,255,.14); display: inline-block; transform: scale(.4); opacity: 0; animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  .stars i.on { color: #ffc95e; text-shadow: 0 0 18px rgba(255,190,80,.45); }
  @keyframes pop { to { transform: scale(1); opacity: 1; } }
  .score { font-size: 40px; font-weight: 750; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .best { display: inline-block; font-size: 12px; background: var(--good); color: #13230f; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .cmp { display: flex; gap: 12px; justify-content: center; align-items: center; margin: 8px 0 2px; }
  .cmp figure { margin: 0; font-size: 11px; color: var(--ink-dim); }
  .cmp img { width: 120px; height: 98px; display: block; background: rgba(255,255,255,.04); border-radius: 10px; }
  table.res { width: 100%; border-collapse: collapse; margin: 12px 0 4px; font-size: 14px; }
  table.res td { padding: 6px 4px; border-top: 1px solid var(--line); text-align: left; }
  table.res td:nth-child(2) { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
  table.res td:nth-child(3) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; width: 64px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
  .grid button { padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; }
  .grid button img { width: 64px; height: 52px; }
  .grid button small { color: #ffc95e; letter-spacing: 2px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="top">
    <div class="lvl"><span id="lvlNum">Bölüm 1</span><b id="lvlName">Kare</b></div>
    <div class="stats">
      <div class="chip"><small id="lbl1">İlerleme</small><span id="sProg">0%</span><i class="bar"><i id="sProgBar"></i></i></div>
      <div class="chip"><small id="lbl2">Doğruluk</small><span id="sAcc">—</span></div>
      <div class="chip"><small>Hamle</small><span id="sMoves">0</span></div>
      <div class="chip"><small>Süre</small><span id="sTime">0:00</span></div>
    </div>
    <div class="btns">
      <a class="btn" id="bHome" href="https://dorukplays.com" title="dorukplays.com'a dön" aria-label="dorukplays.com'a dön">🏠</a>
      <button id="bMute" title="Ses (M)" aria-label="Ses">🔊</button>
      <button id="bRestart" title="Baştan (R)" aria-label="Baştan">↺</button>
      <button id="bMenu" title="Bölümler" aria-label="Bölümler">☰</button>
    </div>
  </div>
  <div id="goal"><small>Sipariş</small><canvas id="goalCv" width="236" height="192"></canvas><div id="goalSw"></div></div>
  <div class="bottom">
    <button class="rot" id="bRotL" aria-label="Sola döndür">⟲</button>
    <div id="brushes">
      <button data-s="0" aria-label="İnce fırça" title="İnce fırça (1)"><i style="width:8px;height:8px"></i></button>
      <button data-s="1" aria-label="Orta fırça" title="Orta fırça (2)"><i style="width:15px;height:15px"></i></button>
      <button data-s="2" aria-label="Kalın fırça" title="Kalın fırça (3)"><i style="width:24px;height:24px"></i></button>
    </div>
    <button id="bFinish" disabled>Bitir ✓</button>
    <button class="rot" id="bRotR" aria-label="Sağa döndür">⟳</button>
  </div>
  <div id="toast"></div>
</div>

<div id="overlay"></div>

<script>
'use strict';
/* =====================================================================
   KIL TESTERE — Scroll Saw Puzzle (tek dosya)
   Bölümler:
   1. SDF       : işaretli uzaklık fonksiyonları (hedef şekiller bunlarla tanımlanır)
   2. Shapes    : palet, renk desenleri, 107 bölüm, küçük resimler
   3. Texture   : prosedürel ahşap dokusu
   4. Sound     : Web Audio ile üretilen sesler
   5. Wood      : piksel maskesi — testere ucunun değdiği her piksel kesilir
   6. Game      : durum, kesim / zikzak / kopma mantığı, puanlama
   7. Effects   : talaş tozu + savrulan tahta yongaları
   8. Paint     : boyama bölümü (fırça, boya kutuları)
   9. Input     : pointer (mouse + touch), klavye, tekerlek
  10. Render    : Canvas çizimi
  11. UI        : HUD + kartlar + sipariş paneli
   ===================================================================== */

const RES = 2;                 // maske pikseli / dünya birimi
const WW = 340, WH = 280;      // ahşap blok boyutu (dünya birimi)
const HW = WW / 2, HH = WH / 2;
const MW = WW * RES, MH = WH * RES, MN = MW * MH;
const GW = WW + 1, GH = WH + 1; // SDF ızgarası (1 birim aralık)

// ============================== 1. SDF ===============================
const SDF = (() => {
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  function poly(pts) {
    const n = pts.length, X = new Float64Array(n), Y = new Float64Array(n);
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    pts.forEach((p, i) => {
      X[i] = p[0]; Y[i] = p[1];
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    });
    return (x, y) => {
      // Kutudan çok uzaktaysa kutu mesafesi yeterli (alt sınır, işaret doğru)
      const bx = x < x0 ? x0 - x : x > x1 ? x - x1 : 0, by = y < y0 ? y0 - y : y > y1 ? y - y1 : 0;
      if (bx > 24 || by > 24) return Math.hypot(bx, by);
      let d = (x - X[0]) ** 2 + (y - Y[0]) ** 2, s = 1;
      for (let i = 0, j = n - 1; i < n; j = i++) {
        const ex = X[j] - X[i], ey = Y[j] - Y[i], wx = x - X[i], wy = y - Y[i];
        const L = ex * ex + ey * ey;
        const t = L > 0 ? clamp((wx * ex + wy * ey) / L, 0, 1) : 0;
        const qx = wx - ex * t, qy = wy - ey * t, dd = qx * qx + qy * qy;
        if (dd < d) d = dd;
        const c1 = y >= Y[i], c2 = y < Y[j], c3 = ex * wy > ey * wx;
        if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
      }
      return s * Math.sqrt(d);
    };
  }
  const circle = (cx, cy, r) => (x, y) => Math.hypot(x - cx, y - cy) - r;
  const box = (cx, cy, hw, hh, r = 0) => (x, y) => {
    const qx = Math.abs(x - cx) - hw + r, qy = Math.abs(y - cy) - hh + r;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
  };
  const ellipse = (cx, cy, a, b) => (x, y) => {
    const px = (x - cx) / a, py = (y - cy) / b, k0 = Math.hypot(px, py), k1 = Math.hypot(px / a, py / b);
    return k1 > 1e-9 ? k0 * (k0 - 1) / k1 : -Math.min(a, b);
  };
  const seg = (ax, ay, bx, by, r) => (x, y) => {
    const ex = bx - ax, ey = by - ay, wx = x - ax, wy = y - ay;
    const t = clamp((wx * ex + wy * ey) / (ex * ex + ey * ey), 0, 1);
    return Math.hypot(wx - ex * t, wy - ey * t) - r;
  };
  const union = (...f) => (x, y) => { let d = Infinity; for (const g of f) { const v = g(x, y); if (v < d) d = v; } return d; };
  const inter = (...f) => (x, y) => { let d = -Infinity; for (const g of f) { const v = g(x, y); if (v > d) d = v; } return d; };
  const sub = (a, ...b) => (x, y) => { let d = a(x, y); for (const g of b) { const v = -g(x, y); if (v > d) d = v; } return d; };
  const smooth = (k, ...f) => (x, y) => {
    let d = f[0](x, y);
    for (let i = 1; i < f.length; i++) {
      const b = f[i](x, y), h = clamp(0.5 + 0.5 * (b - d) / k, 0, 1);
      d = b * (1 - h) + d * h - k * h * (1 - h);
    }
    return d;
  };
  const rot = (f, deg, cx = 0, cy = 0) => {
    const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    return (x, y) => { const dx = x - cx, dy = y - cy; return f(cx + dx * c + dy * s, cy - dx * s + dy * c); };
  };
  const above = (y0) => (x, y) => y - y0;   // y < y0 içerisi
  const below = (y0) => (x, y) => y0 - y;   // y > y0 içerisi
  const leftOf = (x0) => (x, y) => x - x0;  // x < x0 içerisi
  const rightOf = (x0) => (x, y) => x0 - x; // x > x0 içerisi
  return { poly, circle, box, ellipse, seg, union, inter, sub, smooth, rot, above, below, leftOf, rightOf };
})();

// ============================ 2. SHAPES ==============================
/* ---- Boya karışımı ----
   Boya bir pigment vektörüdür: { r: kırmızı, y: sarı, b: mavi, w: beyaz, k: siyah } (miktar).
   Ana renkler RYB küpünde üç doğrusal enterpolasyonla RGB'ye çevrilir (kırmızı+sarı=turuncu,
   sarı+mavi=yeşil, kırmızı+mavi=mor); beyaz açar, siyah koyulaştırır.                      */
const Mix = (() => {
  const C = {
    '000': [1, 1, 1], '100': [0.86, 0.16, 0.13], '010': [0.98, 0.84, 0.2], '001': [0.15, 0.38, 0.8],
    '110': [0.95, 0.52, 0.12], '101': [0.5, 0.22, 0.65], '011': [0.2, 0.6, 0.28], '111': [0.24, 0.16, 0.1],
  };
  const WH = [0.97, 0.96, 0.93], BK = [0.12, 0.11, 0.11];
  function ryb(r, y, b) {
    const out = [0, 0, 0];
    for (const cr of [0, 1]) for (const cy of [0, 1]) for (const cb of [0, 1]) {
      const w = (cr ? r : 1 - r) * (cy ? y : 1 - y) * (cb ? b : 1 - b);
      if (!w) continue;
      const c = C['' + cr + cy + cb];
      out[0] += c[0] * w; out[1] += c[1] * w; out[2] += c[2] * w;
    }
    return out;
  }
  // pigment → [R,G,B] (0-255)
  function rgb(p) {
    const r = p.r || 0, y = p.y || 0, b = p.b || 0, w = p.w || 0, k = p.k || 0;
    const ch = r + y + b, tot = ch + w + k;
    if (tot <= 0) return [200, 180, 150];
    let c = [0, 0, 0];
    if (ch > 0) { const m = Math.max(r, y, b); c = ryb(r / m, y / m, b / m); }
    const fc = ch / tot, fw = w / tot, fk = k / tot;
    return [0, 1, 2].map(i => Math.round(255 * (c[i] * fc + WH[i] * fw + BK[i] * fk)));
  }
  const KEYS = ['r', 'y', 'b', 'w', 'k'];
  function add(a, b, kb = 1) { const o = {}; for (const k of KEYS) o[k] = (a[k] || 0) + (b[k] || 0) * kb; return o; }
  function scale(a, s) { const o = {}; for (const k of KEYS) o[k] = (a[k] || 0) * s; return o; }
  function total(a) { let t = 0; for (const k of KEYS) t += a[k] || 0; return t; }
  function norm(a) { const t = total(a); return t > 0 ? scale(a, 1 / t) : null; }
  // sRGB → CIELAB (renk farkı için)
  function lab(c) {
    const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
    const R = f(c[0]), G = f(c[1]), B = f(c[2]);
    const X = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, Y = R * 0.2126 + G * 0.7152 + B * 0.0722, Z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
    const g = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    const fx = g(X), fy = g(Y), fz = g(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

    if (L.F) return L;
    const f = L.mk();
    let s = 1, ox = 0, oy = 0;
    if (L.fit !== false) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (let y = -230; y <= 230; y += 3) for (let x = -230; x <= 230; x += 3) {

      ox = (x0 + x1) / 2; oy = (y0 + y1) / 2;
    }
    L.fitS = s;
    L.F = (x, y) => f(x / s + ox, y / s + oy) * s;
    L.colorAt = (x, y, d) => PI_OF[L.col.at(x / s + ox, y / s + oy, d / s)];
    L.colors = L.col.keys.map(k => PI_OF[k]);
    return L;

      const rgb = paintFn ? paintFn(x, y) : PALETTE[L.colorAt(x, y, v)].rgb;

  const firstTablo = levels.findIndex(L => L.tablo);

    if (i === 0) return true;

    return !!best[i - 1];
  }
  return { levels, prep, thumb, unlocked };
})();

// ============================ 3. TEXTURE =============================
const Texture = (() => {
  function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
  function make(w, h, seed) {
    const cw = Math.ceil(w * RES), ch = Math.ceil(h * RES);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const g = c.getContext('2d'), img = g.createImageData(cw, ch), d = img.data;
    const a1 = hash(seed) * 6, a2 = hash(seed + 1) * 6, a3 = hash(seed + 2) * 6;
    const kx = (0.25 + hash(seed + 3) * 0.5) * w, ky = (0.2 + hash(seed + 4) * 0.6) * h; // budak
    const light = [222, 172, 112], dark = [168, 108, 58];
    for (let py = 0; py < ch; py++) {
      const y = py / RES;
      const streak = hash(Math.floor(y * 1.3) + seed * 13) * 0.12;
      for (let px = 0; px < cw; px++) {
        const x = px / RES;
        const kdx = x - kx, kdy = (y - ky) * 2.2, kd = Math.sqrt(kdx * kdx + kdy * kdy);
        const knot = 28 * Math.exp(-kd / 26);
        const v = y * 0.42 + 2.6 * Math.sin(x * 0.008 + a1) + 1.3 * Math.sin(x * 0.021 + a2 + y * 0.01) + 0.45 * Math.sin(x * 0.09 + a3) + knot * 0.25 + kd * (knot > 1 ? 0.05 : 0);
        let gr = 0.5 + 0.5 * Math.sin(v);
        gr = gr * gr * gr;
        const n = (hash(px * 0.37 + py * 1.91 + seed) - 0.5) * 0.06;
        const m = Math.min(1, Math.max(0, gr * 0.55 + streak + n + Math.exp(-kd / 9) * 0.5));
        const i = (py * cw + px) * 4;
        d[i] = light[0] + (dark[0] - light[0]) * m;
        d[i + 1] = light[1] + (dark[1] - light[1]) * m;
        d[i + 2] = light[2] + (dark[2] - light[2]) * m;
        d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);
    const vg = g.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.3, cw / 2, ch / 2, Math.max(cw, ch) * 0.75);
    vg.addColorStop(0, 'rgba(255,240,210,0.06)'); vg.addColorStop(1, 'rgba(60,30,10,0.18)');
    g.fillStyle = vg; g.fillRect(0, 0, cw, ch);
    return g.getImageData(0, 0, cw, ch);
  }
  return { make };
})();

// ============================= 4. SOUND ==============================
const Sound = (() => {
  let ctx = null, master = null, cutGain = null, cutFilter = null, humGain = null, noiseBuf = null, brushGain = null;
  let muted = false;
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ctx.destination);
    const len = ctx.sampleRate * 2;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); let br = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; br = (br + 0.02 * w) / 1.02; d[i] = w * 0.35 + br * 3.2; }

// ============================== 5. WOOD ==============================
/* Ahşap bir piksel maskesidir (RES piksel / birim). Testerenin ucu bir
   daire (KERF yarıçapı) olarak maskeyi oyar: ucun değdiği her piksel kesin
   kesilir. Bağlantısı kopan bölgeler "parça" olarak savrulup düşer.      */
const KERF = 1.7;   // testere ucu yarıçapı (birim) — kesik genişliği ≈ 3.4
const W = {
  mask: new Uint8Array(MN), burnt: new Uint8Array(MN), tgt: new Uint8Array(MN),
  lab: new Int32Array(MN), stack: new Int32Array(MN),
  grid: new Float32Array(GW * GH),
  woodCv: null, woodCx: null, woodImg: null, shCv: null, shCx: null, shImg: null,
  dx0: MW, dy0: MH, dx1: -1, dy1: -1,
  dirtyCheck: false, lastCheck: 0, chipRGB: 0xc89a64,

(function initWoodCanvases() {
  W.woodCv = document.createElement('canvas'); W.woodCv.width = MW; W.woodCv.height = MH; W.woodCx = W.woodCv.getContext('2d');
  W.shCv = document.createElement('canvas'); W.shCv.width = MW; W.shCv.height = MH; W.shCx = W.shCv.getContext('2d');
})();

function sdfAt(x, y) {
  const gx = x + HW, gy = y + HH;
  if (!(gx >= 0 && gy >= 0 && gx < WW && gy < WH)) return 99;
  const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * GW + i, g = W.grid;
  return (g[k] * (1 - fx) + g[k + 1] * fx) * (1 - fy) + (g[k + GW] * (1 - fx) + g[k + GW + 1] * fx) * fy;
}
const pxToX = (px) => (px + 0.5) / RES - HW, pxToY = (py) => (py + 0.5) / RES - HH;

function buildWood(L, seed) {
  // SDF ızgarası
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) W.grid[j * GW + i] = L.F(i - HW, j - HH);
  const base = Texture.make(WW, WH, seed);
  const d = base.data;
  for (let py = 0; py < MH; py++) {
    const y = pxToY(py);
    for (let px = 0; px < MW; px++) {
      const i = py * MW + px, v = sdfAt(pxToX(px), y);
      W.tgt[i] = v < 0 ? 1 : 0;
      // kalem çizgisi (grafit, hafif pürüzlü)
      const av = Math.abs(v);
      if (av < 0.75) {
        const f = 0.3 + 0.22 * Math.random() + av * 0.25, k = i * 4;
        d[k] = d[k] * f + 30 * (1 - f); d[k + 1] = d[k + 1] * f + 22 * (1 - f); d[k + 2] = d[k + 2] * f + 18 * (1 - f);
      }
    }
  }
  W.mask.fill(1); W.burnt.fill(0);
  W.woodImg = base;
  W.shImg = W.shCx.createImageData(MW, MH);
  const s = W.shImg.data; for (let i = 3; i < s.length; i += 4) s[i] = 255;
  W.woodCx.putImageData(W.woodImg, 0, 0); W.shCx.putImageData(W.shImg, 0, 0);
  W.dx0 = MW; W.dy0 = MH; W.dx1 = W.dy1 = -1; W.dirtyCheck = false;
}
function markDirty(x0, y0, x1, y1) {
  if (x0 < W.dx0) W.dx0 = x0; if (y0 < W.dy0) W.dy0 = y0; if (x1 > W.dx1) W.dx1 = x1; if (y1 > W.dy1) W.dy1 = y1;
}
function flushWood() {
  if (W.dx1 < 0) return;
  const x = Math.max(0, W.dx0), y = Math.max(0, W.dy0), w = Math.min(MW - 1, W.dx1) - x + 1, h = Math.min(MH - 1, W.dy1) - y + 1;
  if (w > 0 && h > 0) { W.woodCx.putImageData(W.woodImg, 0, 0, x, y, w, h); W.shCx.putImageData(W.shImg, 0, 0, x, y, w, h); }
  W.dx0 = MW; W.dy0 = MH; W.dx1 = W.dy1 = -1;
}
function carvePx(i) {
  W.mask[i] = 0; W.woodImg.data[i * 4 + 3] = 0; W.shImg.data[i * 4 + 3] = 0;
}
function pxRGB(i) { const d = W.woodImg.data, k = i * 4; return (d[k] << 16) | (d[k + 1] << 8) | d[k + 2]; }
const solidAt = (lx, ly) => { const px = Math.floor((lx + HW) * RES), py = Math.floor((ly + HH) * RES); return px >= 0 && py >= 0 && px < MW && py < MH && W.mask[py * MW + px] === 1; };

// Testere ucu damgası: r içindeki her piksel kesilir; hemen dışındaki halka hafifçe yanar
function stampBlade(lx, ly) {
  const cx = (lx + HW) * RES, cy = (ly + HH) * RES, r = KERF * RES, rb = r + 2.4, r2 = r * r, rb2 = rb * rb;
  const x0 = Math.max(0, Math.floor(cx - rb)), x1 = Math.min(MW - 1, Math.ceil(cx + rb));
  const y0 = Math.max(0, Math.floor(cy - rb)), y1 = Math.min(MH - 1, Math.ceil(cy + rb));
  if (x0 > x1 || y0 > y1) return 0;
  const m = W.mask, wd = W.woodImg.data;
  let n = 0;
  for (let py = y0; py <= y1; py++) {
    const dy = py + 0.5 - cy;
    for (let px = x0; px <= x1; px++) {
      const i = py * MW + px;
      if (!m[i]) continue;
      const dx = px + 0.5 - cx, d2 = dx * dx + dy * dy;
      if (d2 <= r2) { if (n === 0) W.chipRGB = pxRGB(i); carvePx(i); n++; }
      else if (d2 <= rb2 && !W.burnt[i]) { W.burnt[i] = 1; const k = i * 4; wd[k] *= 0.8; wd[k + 1] *= 0.74; wd[k + 2] *= 0.68; }
    }

}
function solidNear(lx, ly, rad) {
  const cx = (lx + HW) * RES, cy = (ly + HH) * RES, r = rad * RES, r2 = r * r;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(MW - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(MH - 1, Math.ceil(cy + r));
  for (let py = y0; py <= y1; py++) {
    const dy = py + 0.5 - cy;
    for (let px = x0; px <= x1; px++) {
      const dx = px + 0.5 - cx;

// Çokgen içini oy (zikzak arası parça). pts: yerel birim
function carvePoly(pts) {
  let y0 = Infinity, y1 = -Infinity, x0 = Infinity, x1 = -Infinity;
  const P = pts.map(p => { const x = (p.x + HW) * RES, y = (p.y + HH) * RES; if (y < y0) y0 = y; if (y > y1) y1 = y; if (x < x0) x0 = x; if (x > x1) x1 = x; return { x, y }; });
  const ry0 = Math.max(0, Math.floor(y0)), ry1 = Math.min(MH - 1, Math.ceil(y1));
  const xs = [];
  let n = 0, sx = 0, sy = 0;
  for (let py = ry0; py <= ry1; py++) {
    const yc = py + 0.5; xs.length = 0;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const a = P[i], b = P[j];
      if ((a.y > yc) !== (b.y > yc)) xs.push(a.x + (yc - a.y) / (b.y - a.y) * (b.x - a.x));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(MW - 1, Math.floor(xs[k + 1] - 0.5));
      for (let px = xa; px <= xb; px++) {
        const i = py * MW + px;
        if (W.mask[i]) { if (n === 0) W.chipRGB = pxRGB(i); carvePx(i); n++; sx += px; sy += py; }
      }
    }
  }
  if (n) { markDirty(Math.floor(x0) - 1, ry0, Math.ceil(x1) + 1, ry1); W.dirtyCheck = true; }

}

// Bağlı bileşenleri etiketle; hedefin çoğunu taşıyan kalır, diğerleri kopar
function findComponents() {
  const m = W.mask, lab = W.lab, st = W.stack, tg = W.tgt;
  lab.fill(0);
  const comps = [];
  for (let s = 0; s < MN; s++) {
    if (!m[s] || lab[s]) continue;
    const id = comps.length + 1;
    let sp = 0; st[sp++] = s; lab[s] = id;
    let n = 0, t = 0, x0 = MW, y0 = MH, x1 = 0, y1 = 0, sx = 0, sy = 0;
    while (sp) {
      const i = st[--sp], px = i % MW, py = (i - px) / MW;
      n++; t += tg[i]; sx += px; sy += py;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      if (px > 0 && m[i - 1] && !lab[i - 1]) { lab[i - 1] = id; st[sp++] = i - 1; }
      if (px < MW - 1 && m[i + 1] && !lab[i + 1]) { lab[i + 1] = id; st[sp++] = i + 1; }
      if (py > 0 && m[i - MW] && !lab[i - MW]) { lab[i - MW] = id; st[sp++] = i - MW; }
      if (py < MH - 1 && m[i + MW] && !lab[i + MW]) { lab[i + MW] = id; st[sp++] = i + MW; }
    }
