}
// Bileşeni maskeden çıkarıp kendi görüntüsüne (sprite) dönüştür
function extractComp(c) {
  const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1;
  let cv = null;
  if (c.n >= 20) {
    cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'), img = g.createImageData(w, h), d = img.data, wd = W.woodImg.data;
    for (let py = c.y0; py <= c.y1; py++) for (let px = c.x0; px <= c.x1; px++) {
      const i = py * MW + px;
      if (W.lab[i] !== c.id) continue;
      const k = ((py - c.y0) * w + (px - c.x0)) * 4, s = i * 4;
      d[k] = wd[s]; d[k + 1] = wd[s + 1]; d[k + 2] = wd[s + 2]; d[k + 3] = 255;
      carvePx(i);
    }
    g.putImageData(img, 0, 0);
  } else {
    for (let py = c.y0; py <= c.y1; py++) for (let px = c.x0; px <= c.x1; px++) { const i = py * MW + px; if (W.lab[i] === c.id) carvePx(i); }
  }
  markDirty(c.x0, c.y0, c.x1, c.y1);
  return cv;
}

// ============================== 6. GAME ==============================
const TOL = 3.5;        // doğruluk toleransı (dünya birimi)
const FEED = 140;       // kesim içindeyken maksimum besleme hızı (birim/sn)
const ROT_SPEED = 1.5;  // buton/klavye dönüş hızı (rad/sn)
const SAMPLE = 2;       // doğruluk örnekleme aralığı (birim)
const ZIG_DOT = -0.9;   // bu kadar ters dönüş (≈155°+) zikzak sayılır
const ZIG_MAX = 40;     // zikzak kolları arası en fazla bu kadar açıksa ara parça kesilir

const Store = (() => {
  const KEY = 'kiltestere.v1';
  let data = { best: {}, muted: false };
  try { const s = localStorage.getItem(KEY); if (s) data = Object.assign(data, JSON.parse(s)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} }
  return { data, save };
})();

const G = {
  state: 'intro',          // intro | play | paint | done | menu
  li: 0, level: null,
  wood: { x: 0, y: 0, a: 0 },
  pending: { x: 0, y: 0 }, rotPending: 0,
  cutting: false, idle: 0, trail: [], lastTurn: 0, dirAcc: { x: 0, y: 0 }, lastDir: null, zig: null, prevLocal: null,
  waste: [], floaters: [],
  st: null, m: null, samples: null, keepC: { x: 0, y: 0 },
  feedSpeed: 0, dev: null, completeTimer: -1, toastShown: false, clock: 0,
  shake: 0, cutRes: null, paintFrom: null, paintT: 0,
};

function newStats() { return { cuts: 0, zigs: 0, time: 0, paintTime: 0, started: false, lineSum: 0, lineN: 0 }; }

function buildSamples() {
  const L = G.level, xs = [], ys = [], pi = [], inT = [], dT = [], col = [];
  for (let y = -HH + SAMPLE / 2; y < HH; y += SAMPLE)
    for (let x = -HW + SAMPLE / 2; x < HW; x += SAMPLE) {
      const v = sdfAt(x, y);
      xs.push(x); ys.push(y);
      pi.push(Math.floor((y + HH) * RES) * MW + Math.floor((x + HW) * RES));
      inT.push(v < 0 ? 1 : 0); dT.push(Math.abs(v));
      // beklenen renk; renk sınırına çok yakın örnekler boyamada sayılmaz
      let c = -1;
      if (v < -1.2) {
        c = L.colorAt(x, y, v);
        for (const [ox, oy] of [[2.5, 0], [-2.5, 0], [0, 2.5], [0, -2.5]]) { const v2 = sdfAt(x + ox, y + oy); if (v2 < 0 && L.colorAt(x + ox, y + oy, v2) !== c) { c = -1; break; } }
      }
      col.push(c);
    }
  const s = { n: xs.length, x: Float32Array.from(xs), y: Float32Array.from(ys), pi: Int32Array.from(pi), inT: Uint8Array.from(inT), d: Float32Array.from(dT), col: Int8Array.from(col), targetN: 0, outN: 0 };
  for (let i = 0; i < s.n; i++) { if (s.inT[i]) s.targetN++; else if (s.d[i] > TOL) s.outN++; }
  G.samples = s;
}

// Alan tabanlı doğruluk: hedefin içine taşma + dışarıda kalan fazlalık (tolerans bandı hariç)
function computeMetrics() {
  const s = G.samples, m = W.mask;
  let inErr = 0, outErr = 0, kx = 0, ky = 0, kn = 0;
  for (let i = 0; i < s.n; i++) {
    const inside = m[s.pi[i]] === 1;
    if (inside) { kx += s.x[i]; ky += s.y[i]; kn++; }
    if (s.inT[i]) { if (!inside && s.d[i] > TOL) inErr++; }
    else if (s.d[i] > TOL && inside) outErr++;
  }
  if (kn) G.keepC = { x: kx / kn, y: ky / kn };
  G.m = {
    inErr, outErr,
    progress: 1 - outErr / s.outN,
    inPct: inErr / s.targetN, outPct: outErr / s.targetN,
    acc: Math.max(0, 1 - (1.5 * inErr + outErr) / s.targetN),
  };
}

function toLocal(wx, wy) {
  const w = G.wood, c = Math.cos(w.a), s = Math.sin(w.a), dx = wx - w.x, dy = wy - w.y;
  return { x: dx * c + dy * s, y: -dx * s + dy * c };
}
function toWorld(lx, ly) {
  const w = G.wood, c = Math.cos(w.a), s = Math.sin(w.a);
  return { x: w.x + lx * c - ly * s, y: w.y + lx * s + ly * c };
}
function signedDev(p) { return sdfAt(p.x, p.y); }

function startLevel(i) {
  G.li = Math.max(0, Math.min(Shapes.levels.length - 1, i));
  const L = G.level = Shapes.prep(Shapes.levels[G.li]);
  L.w = WW; L.h = WH;
  buildWood(L, G.li * 7 + 3);
  if (!L.parTime) {
    let per = 0; for (let k = 0; k < W.grid.length; k++) if (Math.abs(W.grid[k]) < 0.5) per++;
    L.parTime = Math.round((12 + per / 16) / 5) * 5;
  }
  G.wood = { x: 0, y: HH + 34, a: 0 };
  G.pending = { x: 0, y: 0 }; G.rotPending = 0;
  resetTrail(); G.prevLocal = toLocal(0, 0);
  G.waste = []; G.floaters = []; G.st = newStats(); G.feedSpeed = 0; G.dev = null;
  G.completeTimer = -1; G.toastShown = false; G.cutRes = null; G.shake = 0;
  Chips.clear(); Particles.clear(); Paint.reset();
  document.body.classList.remove('paint');
  buildSamples(); computeMetrics();
  UI.hideToast(); UI.setGoal(); UI.updateHud(true);
  onResize();
}

function resetTrail() { G.cutting = false; G.idle = 0; G.trail = []; G.lastTurn = 0; G.dirAcc = { x: 0, y: 0 }; G.lastDir = null; G.zig = null; }

// ---- Kesim mantığı ----
function processBlade(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
  const n = Math.max(1, Math.ceil(dist / 0.6));
  let removed = 0;
  for (let k = 1; k <= n; k++) {
    const q = { x: a.x + dx * k / n, y: a.y + dy * k / n };
    const r = stampBlade(q.x, q.y);
    if (r) { removed += r; G.st.started = true; G.cutting = true; G.idle = 0; addTrail(q); }
    else if (G.cutting && G.trail.length) addTrail(q);
  }
  return removed;
}

function addTrail(q) {
  const T = G.trail, last = T[T.length - 1];
  if (last) { const ddx = q.x - last.x, ddy = q.y - last.y; if (ddx * ddx + ddy * ddy < 1.2 * 1.2) return; }
  T.push({ x: q.x, y: q.y });
  if (T.length > 900) { const cut = 300; T.splice(0, cut); G.lastTurn = Math.max(0, G.lastTurn - cut); if (G.zig) { G.zig.a -= cut; G.zig.t -= cut; if (G.zig.a < 0) G.zig = null; } }
  // Canlı çizgi takibi doğruluğu
  const sd = signedDev(q), st = G.st;
  let score = null;
  if (sd < -TOL) score = 0;
  else if (sd <= TOL) score = 1;
  else if (sd <= 18) score = 1 - (sd - TOL) / (18 - TOL);
  if (score !== null) { st.lineSum += score; st.lineN++; }
  // Zikzak (ters dönüş) tespiti: son ~5 birim ile ondan önceki ~5 birimin yönü karşılaştırılır
  const n = T.length - 1, K = 4;
  if (n - 2 * K >= G.lastTurn) {
    const A = T[n - 2 * K], M = T[n - K], Z = T[n];
    const v1x = M.x - A.x, v1y = M.y - A.y, v2x = Z.x - M.x, v2y = Z.y - M.y;
    const l1 = Math.hypot(v1x, v1y), l2 = Math.hypot(v2x, v2y);
    if (l1 > 3 && l2 > 3 && (v1x * v2x + v1y * v2y) / (l1 * l2) < ZIG_DOT) {
      // dönüş noktası: pencerede eski yönde en ileri giden nokta
      let ti = n - K, best = -Infinity;
      for (let i = n - 2 * K; i <= n; i++) { const v = T[i].x * v1x + T[i].y * v1y; if (v > best) { best = v; ti = i; } }
      G.zig = { a: G.lastTurn, t: ti }; G.lastTurn = ti;
    }
  }
  if (G.zig) zigFill();
}

// Zikzak: giden kol ile dönen kol arasındaki ahşap kesilip atılır
function zigFill() {
  const T = G.trail, z = G.zig, C = T[T.length - 1];
  if (T.length - 1 <= z.t + 1) return;
  let bd = Infinity, bk = -1, bp = null;
  for (let k = z.a; k < z.t; k++) {
    const a = T[k], b = T[k + 1], ex = b.x - a.x, ey = b.y - a.y, L2 = ex * ex + ey * ey;
    let t = L2 ? ((C.x - a.x) * ex + (C.y - a.y) * ey) / L2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = a.x + ex * t, py = a.y + ey * t, d = Math.hypot(C.x - px, C.y - py);
    if (d < bd) { bd = d; bk = k; bp = { x: px, y: py }; }
  }
  if (bd > ZIG_MAX) { G.zig = null; return; }
  const poly = [bp].concat(T.slice(bk + 1, z.t + 1), T.slice(z.t + 1));
  if (poly.length < 3) return;
  const r = carvePoly(poly);
  if (r) {
    if (!z.counted && r.n > 30) { z.counted = true; G.st.zigs++; addFloater('zikzak — ara parça kesildi', '#f1c75e'); }
    const sp = toWorld(r.x, r.y);
    Chips.burst(Render.BX + sp.x * Render.S, Render.BY + sp.y * Render.S, Math.min(18, 2 + r.n / 25), W.chipRGB, 1);
    G.shake = Math.max(G.shake, Math.min(3, r.n / 120));
  }
}

// Kopma kontrolü: periyodik (maske değiştiyse)
function checkDetach(force) {
  if (!W.dirtyCheck) return;
  if (!force && G.clock - W.lastCheck < 0.09) return;
  W.lastCheck = G.clock; W.dirtyCheck = false;
  const comps = findComponents();
  if (comps.length <= 1) return;
  let keep = comps[0];
  for (const c of comps) if (c.t > keep.t || (c.t === keep.t && c.n > keep.n)) keep = c;
  let big = 0;
  const kw = toWorld(G.keepC.x, G.keepC.y);
  for (const c of comps) {
    if (c === keep) continue;
    const cv = extractComp(c);
    const lc = { x: c.cx / RES - HW, y: c.cy / RES - HH }, wc = toWorld(lc.x, lc.y);
    const sx = Render.BX + wc.x * Render.S, sy = Render.BY + wc.y * Render.S;
    if (!cv) { Chips.burst(sx, sy, Math.min(6, 1 + c.n / 4), W.chipRGB, 0.6); continue; }
    big = Math.max(big, c.n);
    // sağa ya da sola savrul
    let side = Math.sign(wc.x - kw.x); if (!side) side = Math.random() < 0.5 ? -1 : 1;
    const frame = c.n > 0.25 * MN;
    const sp = frame ? 60 : 150 + Math.random() * 130;
    const dy = wc.y - kw.y, dl = Math.hypot(wc.x - kw.x, dy) || 1;
    G.waste.push({
      cv, lx0: c.x0 / RES - HW, ly0: c.y0 / RES - HH, lw: cv.width / RES, lh: cv.height / RES,
      wood: { ...G.wood }, c: wc, ox: 0, oy: 0,
      vx: side * sp * (0.75 + 0.25 * Math.abs(wc.x - kw.x) / dl), vy: dy / dl * sp * 0.5 - 40,
      z: 0, vz: frame ? 40 : 160 + Math.random() * 120, rot: 0, vr: side * (frame ? 0.25 : 2 + Math.random() * 4), t: 0, frame,
    });
    const n = frame ? 40 : Math.min(30, 8 + c.n / 120);
    Chips.burst(sx, sy, n, W.chipRGB, frame ? 1.4 : 1.1);
  }
  if (big) {
    G.st.cuts++;
    Sound.crack(big > 4000);
    G.shake = Math.max(G.shake, big > 4000 ? 7 : 4);
    if (navigator.vibrate) try { navigator.vibrate(18); } catch (e) {}
    addFloater(big > 0.25 * MN ? 'tek hamlede!' : 'parça koptu!', '#ffe3b8');
  }
  computeMetrics();
  if (G.m.outErr / G.samples.outN < 0.02) G.completeTimer = 0.8;
  UI.updateHud(true);
}

function addFloater(text, color, x, y) {
  const stack = G.floaters.filter(f => f.t < 0.6 && f.x === x).length; // aynı anda çıkanlar üst üste binmesin
  G.floaters.push({ text, color, t: 0, x, y, dy: stack * 18 });
}

function computeResult() {
  const L = G.level, st = G.st, m = G.m, P = G.paintRes || { correct: 0, cover: 0 };
  const acc = m.acc * 100;
  const eff = Math.min(1, L.parMoves / Math.max(1, st.cuts)) * 100;
  const tb = st.time <= L.parTime ? 1 : Math.max(0, 1 - (st.time - L.parTime) / (1.5 * L.parTime));
  const q = m.acc;
  const paint = P.correct * 100;
  const pAcc = Math.round(acc * 60), pEff = Math.round(eff * 25 * q), pTime = Math.round(tb * 1500 * q), pPaint = Math.round(paint * 40 * q);
  const score = pAcc + pEff + pTime + pPaint;
  const stars = (acc >= 90 && eff >= 70 && paint >= 85) ? 3 : (acc >= 75 && paint >= 60) ? 2 : acc >= 45 ? 1 : 0;
  const line = st.lineN ? st.lineSum / st.lineN * 100 : 0;
  return { acc, eff, tb, pAcc, pEff, pTime, pPaint, paint, cover: P.cover * 100, score, stars, line, cuts: st.cuts, zigs: st.zigs, time: st.time };
}

// Kesim bitti → boyama bölümüne geç
function finishCut() {
  if (G.state !== 'play') return;
  checkDetach(true);
  resetTrail();
  Sound.setCut(0); Sound.setHum(false); Sound.chime(1);
  G.state = 'paint';
  G.paintFrom = { ...G.wood }; G.paintT = 0;
  G.waste.forEach(w => { if (w.t < 1.2) w.t = 1.2; });
  Paint.begin();
  document.body.classList.add('paint');
  UI.showPaintToast();
  UI.updateHud(true);
}

function finishLevel() {
  if (G.state !== 'paint') return;
  G.paintRes = Paint.evaluate();
  G.state = 'done';
  const r = computeResult();
  const prev = Store.data.best[G.li];
  const isBest = r.stars > 0 && (!prev || r.score > prev.score);
  if (isBest) Store.data.best[G.li] = { score: r.score, stars: Math.max(r.stars, prev ? prev.stars : 0) };
  else if (prev && r.stars > prev.stars) prev.stars = r.stars;
  Store.save();
  Sound.setBrush(0); Sound.chime(r.stars);
  UI.hideToast();
  setTimeout(() => UI.showResult(r, isBest && !!prev), 350);
}

// ---- Güncelleme döngüsü ----
function update(dt) {
  G.clock += dt;
  updateWaste(dt); Particles.update(dt); Chips.update(dt);
  G.shake *= Math.exp(-9 * dt); if (G.shake < 0.05) G.shake = 0;
  for (const f of G.floaters) f.t += dt;
  G.floaters = G.floaters.filter(f => f.t < 1.4);
  flushWood();
  if (G.state === 'paint') { updatePaint(dt); return; }
  if (G.state !== 'play') { Sound.setCut(0); return; }

  // Döndürme (pivot = bıçak = dünya orijini; böylece kesim noktası kaymaz)
  let da = G.rotPending; G.rotPending = 0;
  da += Input.rotAxis() * ROT_SPEED * (Input.fine() ? 0.35 : 1) * dt;
  if (da) {
    const c = Math.cos(da), s = Math.sin(da), w = G.wood;
    const x = w.x * c - w.y * s, y = w.x * s + w.y * c;
    w.x = x; w.y = y; w.a += da;
  }
  // Öteleme (ahşaba değerken besleme hızı sınırlı → direnç hissi)
  const kv = Input.moveAxis();
  G.pending.x += kv.x * FEED * dt; G.pending.y += kv.y * FEED * dt;
  const inside = solidNear(G.prevLocal.x, G.prevLocal.y, KERF + 1.6);
  const maxStep = (inside ? FEED : 4000) * dt;
  let mx = G.pending.x, my = G.pending.y; const ml = Math.hypot(mx, my);
  if (ml > maxStep) { mx *= maxStep / ml; my *= maxStep / ml; }
  G.pending.x -= mx; G.pending.y -= my;
  if (inside) { const pl = Math.hypot(G.pending.x, G.pending.y); if (pl > 45) { G.pending.x *= 45 / pl; G.pending.y *= 45 / pl; } }
  G.wood.x += mx; G.wood.y += my;

  // Bıçak bloğun çevresinden çok uzaklaşmasın
  const M = 110;
  let bl = toLocal(0, 0);
  const cl = { x: Math.max(-HW - M, Math.min(HW + M, bl.x)), y: Math.max(-HH - M, Math.min(HH + M, bl.y)) };
  if (cl.x !== bl.x || cl.y !== bl.y) {
    const c = Math.cos(G.wood.a), s = Math.sin(G.wood.a);
    G.wood.x = -(cl.x * c - cl.y * s); G.wood.y = -(cl.x * s + cl.y * c); bl = cl;
  }

  const removed = processBlade(G.prevLocal, bl);
  const moved = Math.hypot(bl.x - G.prevLocal.x, bl.y - G.prevLocal.y);
  G.prevLocal = bl;
  if (!removed && !solidNear(bl.x, bl.y, KERF + 1.6)) { G.idle += dt; if (G.idle > 0.25 && G.cutting) resetTrail(); }
  const touching = removed > 0 || solidNear(bl.x, bl.y, KERF + 0.6);
  G.feedSpeed += ((touching ? moved / dt : 0) - G.feedSpeed) * Math.min(1, dt * 10);
  G.dev = touching ? signedDev(bl) : null;

  Sound.setCut(touching ? Math.min(1, 0.18 + G.feedSpeed / FEED) : 0);
  if (removed) {
    Particles.emit(Math.min(8, removed * 0.12));
    Chips.spray(Render.BX, Render.BY, removed * 0.06, W.chipRGB);
  }
  checkDetach(false);

  if (G.st.started) G.st.time += dt;
  const L = G.level;
  if (!G.toastShown && G.st.time > L.parTime * 2.5) { G.toastShown = true; UI.showTimeToast(); }
  if (G.completeTimer > 0 && !touching) { G.completeTimer -= dt; if (G.completeTimer <= 0) finishCut(); }
  UI.updateHud(false);
}

function updateWaste(dt) {
  for (const w of G.waste) {
    w.t += dt;
    const fr = Math.exp(-(w.z > 0 ? 0.6 : 4) * dt);
    w.vz -= 700 * dt; w.z += w.vz * dt;
    if (w.z < 0) { w.z = 0; if (w.vz < -60) { w.vz = -w.vz * 0.3; w.vr *= 0.6; Sound.chipTick(); } else w.vz = 0; }
    w.vx *= fr; w.vy *= fr;
    w.ox += w.vx * dt; w.oy += w.vy * dt; w.rot += w.vr * dt;
  }
  G.waste = G.waste.filter(w => w.t < 2.2);
}

function updatePaint(dt) {
  G.st.paintTime += dt;
  // ahşap ekranın ortasına, düz açıya süzülür
  G.paintT = Math.min(1, G.paintT + dt / 0.9);
  const k = 1 - Math.pow(1 - G.paintT, 3), f = G.paintFrom, S = Render.S;
  const aT = Math.round(f.a / (2 * Math.PI)) * 2 * Math.PI;
  const cy = (Render.paintTop() + Paint.topY() - 8) / 2;
  const tx = (Render.W / 2 - Render.BX) / S - G.keepC.x, ty = (cy - Render.BY) / S - G.keepC.y;
  G.wood.x = f.x + (tx - f.x) * k; G.wood.y = f.y + (ty - f.y) * k; G.wood.a = f.a + (aT - f.a) * k;
  Paint.update(dt);
  UI.updateHud(false);
}

// ======================== 7. EFFECTS ================================
// Talaş tozu (bıçak çevresi, dünya birimi)
const Particles = (() => {
  const MAX = 600;
  const x = new Float32Array(MAX), y = new Float32Array(MAX), vx = new Float32Array(MAX), vy = new Float32Array(MAX);
  const life = new Float32Array(MAX), max = new Float32Array(MAX), size = new Float32Array(MAX), tone = new Float32Array(MAX);
  let n = 0, carry = 0;
  function emit(count) {
    carry += count;
    while (carry >= 1 && n < MAX) {
      carry -= 1;
      const a = Math.random() * Math.PI * 2, sp = 15 + Math.random() * 85;
      x[n] = (Math.random() - 0.5) * 2; y[n] = (Math.random() - 0.5) * 2;
      vx[n] = Math.cos(a) * sp; vy[n] = Math.sin(a) * sp;
      max[n] = life[n] = 0.5 + Math.random() * 0.9; size[n] = 0.8 + Math.random() * 1.8; tone[n] = Math.random();
      n++;
    }
  }
  function update(dt) {
    const drag = Math.exp(-3.2 * dt);
    for (let i = 0; i < n;) {
      life[i] -= dt;
      if (life[i] <= 0) {
        if (Math.random() < 0.55) Render.stampDust(x[i], y[i], size[i]);
        n--; x[i] = x[n]; y[i] = y[n]; vx[i] = vx[n]; vy[i] = vy[n]; life[i] = life[n]; max[i] = max[n]; size[i] = size[n]; tone[i] = tone[n];
        continue;
      }
      vx[i] *= drag; vy[i] *= drag; x[i] += vx[i] * dt; y[i] += vy[i] * dt; i++;
    }
  }
  function draw(c, S, BX, BY, dpr) {
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < n; i++) {
      const a = life[i] / max[i];
      c.globalAlpha = Math.min(1, a * 1.4) * 0.85;
      c.fillStyle = tone[i] < 0.5 ? '#f3d9ae' : '#d9b07a';
      const s = size[i] * S;
      c.fillRect(BX + x[i] * S - s / 2, BY + y[i] * S - s / 2, s, s);
    }
    c.globalAlpha = 1;
  }
  return { emit, update, draw, clear() { n = 0; } };
})();

// Tahta yongaları: sağa sola savrulur, sekip masada kayar (ekran pikseli)
const Chips = (() => {
  const L = [], MAX = 420;
  let carry = 0;
  function css(rgb, j) {
    const r = Math.min(255, Math.max(0, ((rgb >> 16) & 255) + j)), g = Math.min(255, Math.max(0, ((rgb >> 8) & 255) + j)), b = Math.min(255, Math.max(0, (rgb & 255) + j));
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }
  function one(x, y, rgb, sp, ang, big) {
    if (L.length >= MAX) L.shift();
    L.push({
      x, y, z: 1, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp * 0.7, vz: 110 + Math.random() * 300,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 34, w: (1.6 + Math.random() * 3.6) * big, h: (1 + Math.random() * 1.6) * Math.sqrt(big),
      col: css(rgb, (Math.random() - 0.5) * 50), t: 0, life: 1 + Math.random() * 1.1,
    });
  }
  // kesim sırasında: bıçağın iki yanına (sağa/sola) savrulan yongalar
  function spray(x, y, count, rgb) {
    carry += count;
    while (carry >= 1) {
      carry -= 1;
      const side = Math.random() < 0.5 ? 0 : Math.PI;
      one(x + (Math.random() - 0.5) * 3, y + (Math.random() - 0.5) * 3, rgb, 90 + Math.random() * 230, side + (Math.random() - 0.5) * 1.1, 1);
    }
  }
  // parça koptuğunda: her yöne patlama
  function burst(x, y, count, rgb, power) {
    for (let k = 0; k < count; k++) one(x + (Math.random() - 0.5) * 16, y + (Math.random() - 0.5) * 16, rgb, (80 + Math.random() * 260) * power, Math.random() * Math.PI * 2, 1 + Math.random() * power);
  }
  function update(dt) {
    for (const c of L) {
      c.t += dt;
      c.vz -= 950 * dt; c.z += c.vz * dt;
      if (c.z <= 0) {
        c.z = 0;
        if (c.vz < -70) { c.vz = -c.vz * 0.32; c.vx *= 0.6; c.vy *= 0.6; c.vr *= 0.5; }
        else { c.vz = 0; const f = Math.exp(-7 * dt); c.vx *= f; c.vy *= f; c.vr *= f; }
      }
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    }
    for (let i = L.length - 1; i >= 0; i--) if (L[i].t > L[i].life) L.splice(i, 1);
  }
  function draw(ctx, dpr) {
    for (const c of L) {
      const a = Math.min(1, (c.life - c.t) / 0.4);
      if (c.z > 0.5) {
        ctx.globalAlpha = 0.22 * a; ctx.fillStyle = '#000';
        ctx.setTransform(dpr, 0, 0, dpr, dpr * c.x, dpr * c.y);
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      }
      const sc = 1 + c.z * 0.007, cs = Math.cos(c.rot) * sc * dpr, sn = Math.sin(c.rot) * sc * dpr;
      ctx.setTransform(cs, sn, -sn, cs, dpr * c.x, dpr * (c.y - c.z * 0.55));
      ctx.globalAlpha = a; ctx.fillStyle = c.col;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    }
    ctx.globalAlpha = 1;
  }
  return { spray, burst, update, draw, clear() { L.length = 0; carry = 0; } };
})();

// ============================== 8. PAINT =============================
const Paint = (() => {
  const SIZES = [4, 9, 16];                 // fırça yarıçapı (birim)
  const cv = document.createElement('canvas'); cv.width = MW; cv.height = MH;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const guide = document.createElement('canvas'); guide.width = MW; guide.height = MH;
  const WELL_MAX = 8;                       // tabak gözü en fazla bu kadar birim boya alır
  const P = {
    cv, guide, size: 1, pig: null, rgb: null, css: '#e8d6b4', load: 0, hover: null, down: false, last: null,
    dip: null, dryWarned: false, stroke: 0, dirty: false, evalT: 0, live: { cover: 0, correct: 0 }, drips: [], wells: [],
  };
  P.reset = () => {
    cx.globalCompositeOperation = 'source-over'; cx.clearRect(0, 0, MW, MH);
    setBrush(null); P.load = 0; P.down = false; P.last = null; P.dip = null; P.dryWarned = false; P.live = { cover: 0, correct: 0 }; P.drips = [];
    P.wells = [0, 1, 2, 3].map(() => ({ pig: {}, amt: 0, rgb: null, css: null, stir: 0 }));
    P.setSize(1);
  };
  P.setSize = (i) => {
    P.size = i;
    document.querySelectorAll('#brushes button').forEach(b => b.classList.toggle('sel', +b.dataset.s === i));
  };
  function setBrush(pig) { P.pig = pig; P.rgb = pig ? Mix.rgb(pig) : null; P.css = P.rgb ? Mix.css(P.rgb) : '#e8d6b4'; }
  P.colorName = (rgb) => { const n = nearestColor(rgb); return n.d < 9 ? PALETTE[n.i].name : 'Karışım'; };
  // renk bölgelerinin sınırlarını ince beyaz kılavuz çizgi olarak hazırla
  P.begin = () => {
    const g = guide.getContext('2d'), img = g.createImageData(MW, MH), d = img.data, L = G.level;
    const col = new Int8Array(MW * MH).fill(-1);
    if (L.colors.length > 1) {
      for (let py = 0; py < MH; py += 1) for (let px = 0; px < MW; px += 1) {
        const i = py * MW + px; if (!W.tgt[i]) continue;
        const x = pxToX(px), y = pxToY(py); col[i] = L.colorAt(x, y, sdfAt(x, y));
      }
      for (let py = 1; py < MH - 1; py++) for (let px = 1; px < MW - 1; px++) {
        const i = py * MW + px, c = col[i];
        if (c < 0) continue;
        if ((col[i + 1] >= 0 && col[i + 1] !== c) || (col[i + MW] >= 0 && col[i + MW] !== c)) {
          const k = i * 4; d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = ((px + py) >> 2) & 1 ? 170 : 40;
        }
      }
    }
    g.putImageData(img, 0, 0);
  };
  // ---- yerleşim: altta boya kutuları + su, üstünde karıştırma tabağı ----
  const sab = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0;
  P.potsY = () => Render.H - Math.max(118, 104 + sab());
  P.wellsY = () => P.potsY() - 60;
  P.topY = () => P.wellsY() - 56;
  P.pots = () => {
    const items = POTS.concat([{ k: 'water', name: 'Su', hex: '#8fbcd4', water: true }]);
    const n = items.length, gap = Math.min(60, (Render.W - 20) / n), y = P.potsY();
    const x0 = Render.W / 2 - gap * (n - 1) / 2, r = Math.min(18, gap * 0.36);
    return items.map((p, i) => ({ i, p, x: x0 + i * gap, y, r, water: !!p.water }));
  };
  P.wellPos = () => {
    const n = P.wells.length, gap = Math.min(74, (Render.W - 40) / n), y = P.wellsY();
    const x0 = Render.W / 2 - gap * (n - 1) / 2, r = Math.min(19, gap * 0.3);
    return P.wells.map((w, i) => ({ i, w, x: x0 + i * gap, y, r }));
  };
  function hit(sx, sy) {
    for (const o of P.pots()) if (Math.abs(sx - o.x) < o.r + 7 && sy > o.y - o.r - 18 && sy < o.y + o.r + 22) return { type: o.water ? 'water' : 'pot', o };
    for (const o of P.wellPos()) {
      if (o.w.amt > 0 && Math.hypot(sx - (o.x + o.r * 0.95), sy - (o.y - o.r * 0.8)) < 9) return { type: 'clear', o };
      if (Math.hypot(sx - o.x, (sy - o.y) * 1.4) < o.r + 8) return { type: 'well', o };
    }
    return null;
  }
  function screenToLocal(sx, sy) {
    const wx = (sx - Render.BX) / Render.S, wy = (sy - Render.BY) / Render.S;
    return toLocal(wx, wy);
  }
  function stamp(lx, ly, alpha) {
    const pr = SIZES[P.size] * RES, x = (lx + HW) * RES, y = (ly + HH) * RES;
    cx.fillStyle = P.css;
    cx.globalAlpha = alpha;
    cx.beginPath(); cx.arc(x, y, pr, 0, Math.PI * 2); cx.fill();
    // kıl izleri
    cx.globalAlpha = alpha * 0.6;
    for (let k = 0; k < 3; k++) { const a = Math.random() * 6.28, rr = pr * (0.7 + Math.random() * 0.35); cx.beginPath(); cx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr, pr * 0.18, 0, 6.28); cx.fill(); }
    cx.globalAlpha = 1;
    P.dirty = true;
  }
  function strokeTo(p) {
    if (!P.pig || P.load <= 0.005) {
      if (!P.dryWarned) { P.dryWarned = true; addFloater(!P.pig ? 'Önce fırçayı bir boyaya daldır' : 'Fırça kurudu — boyaya daldır', '#ffe3b8', P.hover && P.hover.x, P.hover && P.hover.y); }
      P.last = p; return;
    }
    const a = P.last || p, dx = p.x - a.x, dy = p.y - a.y, dist = Math.hypot(dx, dy), r = SIZES[P.size];
    const step = Math.max(0.6, r * 0.3), n = Math.max(1, Math.ceil(dist / step));
    for (let k = P.last ? 1 : 0; k <= n; k++) {
      if (P.load <= 0.005) break;
      const alpha = 0.5 * (0.25 + 0.75 * Math.min(1, P.load * 1.6));
      stamp(a.x + dx * k / n, a.y + dy * k / n, alpha);
      if (solidAt(a.x + dx * k / n, a.y + dy * k / n)) P.load -= (dist / n || 0.5) * r * 1.1e-4;
    }
    P.load = Math.max(0, P.load);
    P.stroke += dist;
    P.last = p;
  }
  // Daldırma sonucu: kutu, su ya da tabak gözü
  function apply(h) {
    const loaded = P.pig && P.load > 0.05;
    if (h.type === 'water') {
      setBrush(null); P.load = 0; P.dryWarned = false;
      addFloater('Fırça temizlendi', '#bfe3f5', h.o.x, h.o.y - 40);
      return;
    }
    if (h.type === 'pot') {
      // fırçada başka boya varsa kutudaki boyayla karışır
      const pig = loaded ? Mix.norm(Mix.add(Mix.scale(P.pig, P.load * 0.5), h.o.p.pig)) : { ...h.o.p.pig };
      setBrush(pig); P.load = 1; P.dryWarned = false;
      addFloater(loaded ? 'karıştı: ' + P.colorName(P.rgb) : h.o.p.name, P.css, h.o.x, h.o.y - 40);
      return;
    }
    if (h.type === 'well') {
      const w = h.o.w;
      if (loaded) {
        w.pig = Mix.add(w.pig, P.pig, P.load); w.amt = Mix.total(w.pig);
        if (w.amt > WELL_MAX) { w.pig = Mix.scale(w.pig, WELL_MAX / w.amt); w.amt = WELL_MAX; }
        w.rgb = Mix.rgb(w.pig); w.css = Mix.css(w.rgb); w.stir = 0.6;
      }
      if (w.amt > 0.01) {
        setBrush(Mix.norm(w.pig)); P.load = 1; P.dryWarned = false;
        addFloater(P.colorName(P.rgb), P.css, h.o.x, h.o.y - 34);
      } else addFloater('Tabak boş — önce kutudan boya getir', '#ffe3b8', h.o.x, h.o.y - 34);
    }
  }
  P.down = false;
  P.pointerDown = (sx, sy) => {
    P.hover = { x: sx, y: sy };
    if (G.paintT < 1 || P.dip) return;
    const h = hit(sx, sy);
    if (h && h.type === 'clear') { const w = h.o.w; w.pig = {}; w.amt = 0; w.rgb = w.css = null; Sound.tick(); return; }
    if (h) { P.dip = { h, t: 0, done: false }; return; }
    P.down = true; P.last = null;
    strokeTo(screenToLocal(sx, sy));
  };
  P.pointerMove = (sx, sy) => {
    P.hover = { x: sx, y: sy };
    if (P.down && !P.dip) strokeTo(screenToLocal(sx, sy));
  };
  P.pointerUp = () => { P.down = false; P.last = null; };
  P.update = (dt) => {
    if (P.dip) {
      P.dip.t += dt;
      if (!P.dip.done && P.dip.t > 0.28) { P.dip.done = true; apply(P.dip.h); Sound.dip(); }
      if (P.dip.t > 0.6) P.dip = null;
    }
    for (const w of P.wells) if (w.stir > 0) w.stir = Math.max(0, w.stir - dt);
    if (P.dirty) {
      cx.globalCompositeOperation = 'destination-in'; cx.drawImage(W.woodCv, 0, 0); cx.globalCompositeOperation = 'source-over';
      P.dirty = false;
    }
    Sound.setBrush(P.down && P.load > 0 ? Math.min(1, P.stroke / dt / 200) : 0);
    P.stroke = 0;
    // boyalı fırçadan damlalar
    if (P.pig && P.load > 0.6 && P.hover && !P.down && Math.random() < dt * 1.5 * P.load) P.drips.push({ x: P.hover.x + 6, y: P.hover.y + 10, vy: 0, t: 0, c: P.css });
    for (const d of P.drips) { d.t += dt; d.vy += 600 * dt; d.y += d.vy * dt; }
    P.drips = P.drips.filter(d => d.t < 0.5);
    P.evalT -= dt;
    if (P.evalT <= 0) { P.evalT = 0.4; P.live = P.evaluate(); }
  };
  // Renk doğruluğu: istenen renge CIELAB uzaklığı (ΔE ≤ 12 tam puan, ≥ 40 sıfır)
  P.evaluate = () => {
    const d = cx.getImageData(0, 0, MW, MH).data, s = G.samples;
    let tot = 0, totC = 0, cover = 0, correct = 0;
    for (let i = 0; i < s.n; i++) {
      if (!s.inT[i] || s.d[i] < 1.2 || !W.mask[s.pi[i]]) continue;
      tot++;
      const k = s.pi[i] * 4, painted = d[k + 3] >= 110;
      if (painted) cover++;
      if (s.col[i] < 0) continue;
      totC++;
      if (!painted) continue;
      const e = Mix.dE(Mix.lab([d[k], d[k + 1], d[k + 2]]), PALETTE[s.col[i]].lab);
      correct += e <= 12 ? 1 : e >= 40 ? 0 : 1 - (e - 12) / 28;
    }
    return { cover: tot ? cover / tot : 0, correct: totC ? correct / totC : 0 };
  };
  P.SIZES = SIZES;
  return P;
})();

// ============================== 9. INPUT =============================
const Input = (() => {
  const pointers = new Map();
  const keys = new Set();
  let btnRot = 0;
  const canvas = document.getElementById('c');

  function onDown(e) {
    Sound.init();
    if (G.state === 'paint') {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault(); Paint.pointerDown(e.clientX, e.clientY); return;
    }
    if (G.state !== 'play') return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* bazı tarayıcılarda/sentetik olaylarda desteklenmez */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, btn: e.button });
    e.preventDefault();
  }
  function onMove(e) {
    if (G.state === 'paint') { e.preventDefault(); Paint.pointerMove(e.clientX, e.clientY); return; }
    const p = pointers.get(e.pointerId);
    if (!p) return;
    e.preventDefault();
    if (pointers.size === 1) {
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      if (p.btn === 2 || e.shiftKey) G.rotPending += dx * 0.006;  // sağ tık / shift + sürükle = döndür
      else { G.pending.x += dx / Render.S; G.pending.y += dy / Render.S; }
    } else {
      // İki parmak: açı farkı = döndürme, orta nokta hareketi = öteleme
      const ids = [...pointers.keys()].slice(0, 2);
      if (ids.includes(e.pointerId)) {
        const a0 = pointers.get(ids[0]), b0 = pointers.get(ids[1]);
        const a1 = ids[0] === e.pointerId ? { x: e.clientX, y: e.clientY } : a0;
        const b1 = ids[1] === e.pointerId ? { x: e.clientX, y: e.clientY } : b0;
        let d = Math.atan2(b1.y - a1.y, b1.x - a1.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x);
        if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
        G.rotPending += d;
        G.pending.x += ((a1.x + b1.x) - (a0.x + b0.x)) / 2 / Render.S;
        G.pending.y += ((a1.y + b1.y) - (a0.y + b0.y)) / 2 / Render.S;
      }
    }
    p.x = e.clientX; p.y = e.clientY;
  }
  function onUp(e) { pointers.delete(e.pointerId); if (G.state === 'paint') Paint.pointerUp(); }

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  canvas.addEventListener('pointermove', onMove, { passive: false });
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('lostpointercapture', onUp);
  canvas.addEventListener('pointerleave', () => { if (G.state === 'paint' && !Paint.down) Paint.hover = null; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    if (G.state === 'play') G.rotPending += Math.max(-120, Math.min(120, e.deltaY)) * 0.0035;
  }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault()); // iOS Safari pinch-zoom engeli

  window.addEventListener('keydown', e => {
    if (e.repeat && !/^(KeyQ|KeyE|Arrow|KeyW|KeyA|KeyS|KeyD)/.test(e.code)) return;
    keys.add(e.code);
    if (e.code === 'KeyM') UI.toggleMute();
    if (e.code === 'KeyR' && (G.state === 'play' || G.state === 'paint')) { Sound.tick(); startLevel(G.li); G.state = 'play'; }
    if (e.code === 'Enter') UI.enter();
    if (e.code === 'Escape' && G.state === 'menu') UI.back();
    if (G.state === 'paint' && /^Digit[123]$/.test(e.code)) Paint.setSize(+e.code.slice(5) - 1);
    if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
    Sound.init();
  });
  window.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => { keys.clear(); pointers.clear(); btnRot = 0; });

  function bindHold(el, dir) {
    const on = e => { e.preventDefault(); Sound.init(); btnRot = dir; el.classList.add('held'); };
    const off = () => { if (btnRot === dir) btnRot = 0; el.classList.remove('held'); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold(document.getElementById('bRotL'), -1);
  bindHold(document.getElementById('bRotR'), 1);
  document.querySelectorAll('#brushes button').forEach(b => b.addEventListener('click', () => { Sound.init(); Sound.tick(); Paint.setSize(+b.dataset.s); }));

  return {
    rotAxis() {
      let r = btnRot;
      if (keys.has('KeyQ') || keys.has('ArrowLeft')) r -= 1;
      if (keys.has('KeyE') || keys.has('ArrowRight')) r += 1;
      return Math.max(-1, Math.min(1, r));
    },
    moveAxis() {
      let x = 0, y = 0;
      if (keys.has('KeyA')) x -= 1; if (keys.has('KeyD')) x += 1;
      if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1; if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
      return { x, y };
    },
    fine() { return keys.has('ShiftLeft') || keys.has('ShiftRight'); },
    reset() { pointers.clear(); btnRot = 0; },
  };
})();

// ============================= 10. RENDER ============================
const Render = (() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const R = { S: 1, BX: 0, BY: 0, W: 0, H: 0, DPR: 1 };
  let table = null, dust = null, dctx = null, OX = 0, OY = 0;

  R.resize = function () {
    R.DPR = Math.min(window.devicePixelRatio || 1, 2);
    R.W = window.innerWidth; R.H = window.innerHeight;
    canvas.width = Math.round(R.W * R.DPR); canvas.height = Math.round(R.H * R.DPR);
    const maxDim = Math.max(WW, WH);
    R.BX = R.W / 2; R.BY = Math.round(Math.max(130, R.H * 0.30));
    R.S = Math.max(0.45, Math.min(1.7, R.W * 0.92 / (maxDim * 1.15), (R.H - R.BY - 100) / (WH + 50)));
    buildTable();
    dust = document.createElement('canvas'); dust.width = canvas.width; dust.height = canvas.height; dctx = dust.getContext('2d');
    UI.placeGoal();
  };
  R.paintTop = () => { const t = document.querySelector('.top'); return t ? t.offsetHeight + 8 : 70; };

  function buildTable() {
    table = document.createElement('canvas'); table.width = canvas.width; table.height = canvas.height;
    const c = table.getContext('2d'), d = R.DPR, W = R.W, H = R.H, S = R.S;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.fillStyle = '#3a271a'; c.fillRect(0, 0, W, H);
    const plank = 74;
    for (let y = -((R.BY) % plank); y < H; y += plank) {
      const g = c.createLinearGradient(0, y, 0, y + plank);
      g.addColorStop(0, 'rgba(255,220,170,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0.12)');
      c.fillStyle = g; c.fillRect(0, y, W, plank);
      c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(0, y + plank - 1.5, W, 1.5);
      c.strokeStyle = 'rgba(255,210,160,0.035)'; c.lineWidth = 1;
      for (let k = 0; k < 5; k++) {
        c.beginPath();
        const yy = y + 10 + k * 13 + Math.sin(k * 3.1 + y) * 3;
        for (let x = 0; x <= W; x += 24) c.lineTo(x, yy + Math.sin(x * 0.012 + k + y * 0.1) * 3);
        c.stroke();
      }
    }
    // Testere tablası (sıcak gri döküm metal)
    const tw = Math.min(W - 24, 560 * S), th = Math.min(H * 1.2, 520 * S);
    const tx = R.BX - tw / 2, ty = R.BY - th * 0.42;
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 30; c.shadowOffsetY = 10;
    roundRect(c, tx, ty, tw, th, 26 * S); c.fillStyle = '#5c5650'; c.fill();
    c.restore();
    const mg = c.createRadialGradient(R.BX, R.BY - th * 0.1, 10, R.BX, R.BY, Math.max(tw, th) * 0.7);
    mg.addColorStop(0, '#6f6861'); mg.addColorStop(1, '#4b4540');
    roundRect(c, tx, ty, tw, th, 26 * S); c.fillStyle = mg; c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.07)'; c.lineWidth = 1.5; c.stroke();
    c.save(); roundRect(c, tx, ty, tw, th, 26 * S); c.clip();
    c.strokeStyle = 'rgba(255,255,255,0.025)';
    for (let x = tx; x < tx + tw; x += 3) { c.beginPath(); c.moveTo(x, ty); c.lineTo(x + 12, ty + th); c.stroke(); }
    c.restore();
    // Boğaz plakası + bıçak yarığı
    const r = 30 * S;
    c.beginPath(); c.arc(R.BX, R.BY, r, 0, Math.PI * 2); c.fillStyle = '#3d3834'; c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.1)'; c.lineWidth = 1; c.stroke();
    c.beginPath(); c.arc(R.BX, R.BY, r * 0.72, 0, Math.PI * 2); c.strokeStyle = 'rgba(0,0,0,0.25)'; c.stroke();
    c.fillStyle = '#141210'; c.fillRect(R.BX - 1.5, R.BY - 7 * S, 3, 14 * S);
    const vg = c.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,5,0,0.55)');
    c.fillStyle = vg; c.fillRect(0, 0, W, H);
  }
  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  R.stampDust = function (x, y, s) {
    if (!dctx) return;
    dctx.setTransform(R.DPR, 0, 0, R.DPR, 0, 0);
    dctx.fillStyle = Math.random() < 0.5 ? 'rgba(236,206,160,0.35)' : 'rgba(210,170,120,0.3)';
    const k = s * R.S * 0.8;
    dctx.fillRect(R.BX + x * R.S - k / 2, R.BY + y * R.S - k / 2, k, k);
  };
  R.clearDust = function () { if (dctx) dctx.clearRect(0, 0, dust.width, dust.height); };

  function setWorld(ox, oy) { ctx.setTransform(R.DPR * R.S, 0, 0, R.DPR * R.S, R.DPR * (R.BX + ox + OX), R.DPR * (R.BY + oy + OY)); }
  const woodXf = () => { ctx.translate(G.wood.x, G.wood.y); ctx.rotate(G.wood.a); };

  // Kalınlık + gölge + doku
  function drawBoard(img, shadow, xf, x, y, w, h, alpha, lift) {
    ctx.globalAlpha = alpha * 0.2; setWorld(lift * 0.6, lift); xf(); ctx.drawImage(shadow, x, y, w, h);
    ctx.globalAlpha = alpha * 0.16; setWorld(lift * 0.3, lift * 0.55); xf(); ctx.drawImage(shadow, x, y, w, h);
    ctx.globalAlpha = alpha * 0.85; setWorld(0.8, 1.8); xf(); ctx.drawImage(shadow, x, y, w, h); // kenar kalınlığı
    ctx.globalAlpha = alpha; setWorld(0, 0); xf(); ctx.drawImage(img, x, y, w, h);
    ctx.globalAlpha = 1;
  }

  // Testere bıçağı: kesim noktası = ucun sivri dişi
  function drawBlade(bx, by, t) {
    const run = G.state === 'play';
    const stroke = run ? (t * 2 * 18 * 6) % 6 : 0;               // dişlerin aşağı yukarı akışı
    const jx = G.cutting && run ? (Math.random() - 0.5) * 0.9 : 0;
    const len = Math.min(90, by - 20), top = by - len;
    // kelepçe / üst kol
    ctx.fillStyle = 'rgba(52,56,62,0.32)'; ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
    roundRect(ctx, bx - 15, -20, 30, top + 20 - 6, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5b6068'; roundRect(ctx, bx - 9, top - 12, 18, 14, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(bx - 7, top - 10, 14, 2);
    // baskı ayağı
    ctx.beginPath(); ctx.arc(bx, by, 20, Math.PI * 1.15, Math.PI * 1.85); ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(70,74,80,0.55)'; ctx.stroke();
    // bıçak gövdesi
    const x0 = bx - 2.6 + jx, x1 = bx + 2.6 + jx;
    const g = ctx.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, '#8d949c'); g.addColorStop(0.45, '#eef2f5'); g.addColorStop(1, '#a3aab2');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x1, top); ctx.lineTo(x1, by - 4); ctx.lineTo(bx + jx, by + 1.5); ctx.lineTo(x0, by - 6); ctx.closePath(); ctx.fill();
    // dişler (sol kenar, kesme yönü)
    ctx.save();
    ctx.beginPath(); ctx.rect(bx - 9, top, 12, len - 1); ctx.clip();
    ctx.fillStyle = '#c9ced4';
    ctx.beginPath();
    for (let y = top - 6 + stroke; y < by; y += 6) { ctx.moveTo(x0, y); ctx.lineTo(x0 - 3.2, y + 4.2); ctx.lineTo(x0, y + 5); }
    ctx.fill();
    ctx.restore();
    // uç dişi (keskin) + parlama
    ctx.fillStyle = '#f5f7f9';
    ctx.beginPath(); ctx.moveTo(x0, by - 6); ctx.lineTo(x0 - 3.6, by - 1.2); ctx.lineTo(bx + jx, by + 1.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fillRect(bx - 0.5 + jx, top + 2, 1, len - 8);
    if (G.cutting && run) {
      ctx.beginPath(); ctx.arc(bx, by, 4.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,214,150,0.35)'; ctx.fill();
    }
  }

  function drawPots(t) {
    const dip = Paint.dip, dipO = dip && dip.h.o;
    // karıştırma tabağı (ressam paleti)
    const wells = Paint.wellPos();
    if (wells.length) {
      const x0 = wells[0].x - wells[0].r - 22, x1 = wells[wells.length - 1].x + wells[0].r + 22, y = wells[0].y, h = wells[0].r * 2 + 20;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; roundRect(ctx, x0 + 3, y - h / 2 + 4, x1 - x0, h, h / 2); ctx.fill();
      const pg = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2); pg.addColorStop(0, '#e2bd86'); pg.addColorStop(1, '#c29357');
      ctx.fillStyle = pg; roundRect(ctx, x0, y - h / 2, x1 - x0, h, h / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(80,45,15,0.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.font = '600 9px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(70,40,15,0.7)';
      ctx.fillText('KARIŞTIRMA TABAĞI', (x0 + x1) / 2, y + h / 2 - 3);
      for (const o of wells) {
        const r = o.r, w = o.w;
        ctx.beginPath(); ctx.ellipse(o.x, o.y - 2, r, r * 0.62, 0, 0, 6.28); ctx.fillStyle = '#f4efe6'; ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
        ctx.beginPath(); ctx.ellipse(o.x, o.y - 1, r * 0.78, r * 0.44, 0, 0, 6.28); ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fill();
        if (w.amt > 0) {
          const f = 0.45 + 0.4 * Math.min(1, w.amt / 4), wob = w.stir > 0 ? Math.sin(w.stir * 40) * 0.08 : 0;
          ctx.beginPath(); ctx.ellipse(o.x, o.y - 1, r * 0.78 * f * (1 + wob), r * 0.44 * f, wob * 3, 0, 6.28); ctx.fillStyle = w.css; ctx.fill();
          if (w.stir > 0) { ctx.beginPath(); ctx.arc(o.x, o.y - 1, r * 0.3 * f, w.stir * 20, w.stir * 20 + 4); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.lineWidth = 1; }
          // temizle (×)
          const cxp = o.x + r * 0.95, cyp = o.y - r * 0.8;
          ctx.beginPath(); ctx.arc(cxp, cyp, 7, 0, 6.28); ctx.fillStyle = 'rgba(40,25,15,0.8)'; ctx.fill();
          ctx.strokeStyle = '#f3dcc0'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cxp - 3, cyp - 3); ctx.lineTo(cxp + 3, cyp + 3); ctx.moveTo(cxp + 3, cyp - 3); ctx.lineTo(cxp - 3, cyp + 3); ctx.stroke(); ctx.lineWidth = 1;
        }
      }
    }
    // boya kutuları + su kabı
    for (const o of Paint.pots()) {
      const r = o.r, x = o.x, y = o.y, ht = r * 1.25, hex = o.p.hex;
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x + 2, y + ht + 3, r * 1.05, r * 0.35, 0, 0, 6.28); ctx.fill();
      if (o.water) {
        ctx.fillStyle = 'rgba(200,225,240,0.35)'; ctx.fillRect(x - r, y, r * 2, ht);
        ctx.beginPath(); ctx.ellipse(x, y + ht, r, r * 0.35, 0, 0, Math.PI); ctx.fill();
        ctx.fillStyle = 'rgba(120,170,200,0.55)'; ctx.fillRect(x - r + 2, y + 3, r * 2 - 4, ht - 3);
        ctx.strokeStyle = 'rgba(230,245,255,0.6)'; ctx.strokeRect(x - r, y, r * 2, ht);
      } else {
        const g = ctx.createLinearGradient(x - r, 0, x + r, 0);
        g.addColorStop(0, '#6d6a66'); g.addColorStop(0.4, '#c4c0ba'); g.addColorStop(1, '#5d5a56');
        ctx.fillStyle = g; ctx.fillRect(x - r, y, r * 2, ht);
        ctx.beginPath(); ctx.ellipse(x, y + ht, r, r * 0.35, 0, 0, Math.PI); ctx.fill();
        ctx.fillStyle = hex; ctx.fillRect(x - r, y + ht * 0.35, r * 2, ht * 0.35);
      }
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.35, 0, 0, 6.28); ctx.fillStyle = o.water ? 'rgba(210,230,240,0.6)' : '#8b8781'; ctx.fill();
      const wob = dipO && dipO.p === o.p ? Math.sin(dip.t * 30) * 0.08 : 0;
      ctx.beginPath(); ctx.ellipse(x, y + 0.5, r * (0.86 + wob), r * 0.28, 0, 0, 6.28); ctx.fillStyle = hex; ctx.fill();
      ctx.beginPath(); ctx.ellipse(x - r * 0.3, y - 1, r * 0.25, r * 0.07, 0, 0, 6.28); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
      ctx.font = '600 10px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,236,210,0.75)';
      ctx.fillText(o.p.name, x, y + ht + r * 0.35 + 12);
    }
  }

  function drawBrush(t) {
    const P = Paint, dip = P.dip;
    let x, y, dipping = false;
    if (dip) {
      const p = dip.h.o, k = dip.t / 0.6, down = k < 0.5 ? k / 0.5 : 1 - (k - 0.5) / 0.5;
      const depth = dip.h.type === 'well' ? 22 : 30;
      x = p.x; y = p.y - 26 + down * depth; dipping = dip.h.type !== 'well' && down > 0.4;
    } else if (P.hover) { x = P.hover.x; y = P.hover.y; } else return;
    const size = P.size, bw = [5, 8, 12][size], bl = [14, 17, 20][size];
    const ang = -0.55, c = Math.cos(ang), s = Math.sin(ang);
    ctx.setTransform(R.DPR * c, R.DPR * s, -R.DPR * s, R.DPR * c, R.DPR * x, R.DPR * y);
    // kıllar (uç = imleç noktası)
    const has = P.pig && P.load > 0.01;
    ctx.fillStyle = '#d9c39a';
    ctx.beginPath(); ctx.moveTo(-bw / 2, -bl); ctx.lineTo(bw / 2, -bl); ctx.quadraticCurveTo(bw / 2 + 1, -3, 0, 0); ctx.quadraticCurveTo(-bw / 2 - 1, -3, -bw / 2, -bl); ctx.fill();
    if (has) {
      ctx.globalAlpha = 0.35 + 0.65 * Math.min(1, P.load * 1.4); ctx.fillStyle = P.css;
      const h = bl * (0.35 + 0.55 * P.load);
      ctx.beginPath(); ctx.moveTo(-bw / 2, -h); ctx.lineTo(bw / 2, -h); ctx.quadraticCurveTo(bw / 2 + 1, -3, 0, 0); ctx.quadraticCurveTo(-bw / 2 - 1, -3, -bw / 2, -h); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // metal bilezik
    ctx.fillStyle = '#b9bec4'; ctx.fillRect(-bw / 2 - 1, -bl - 9, bw + 2, 10);
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-bw / 2 - 1, -bl - 5, bw + 2, 1.5);
    // sap
    const hg = ctx.createLinearGradient(-4, 0, 4, 0); hg.addColorStop(0, '#7a3f1d'); hg.addColorStop(0.5, '#c46a32'); hg.addColorStop(1, '#6b3518');
    ctx.fillStyle = hg; roundRect(ctx, -3.6, -bl - 62, 7.2, 54, 3.5); ctx.fill();
    ctx.setTransform(R.DPR, 0, 0, R.DPR, 0, 0);
    // daldırılırken kutunun ön dudağı fırçanın önünde
    if (dipping) {
      const p = dip.h.o, r = p.r;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.35, 0, 0, Math.PI); ctx.lineTo(p.x - r, p.y + r * 0.6); ctx.lineTo(p.x + r, p.y + r * 0.6); ctx.closePath();
      ctx.fillStyle = p.p.hex; ctx.fill();
      ctx.fillStyle = p.water ? 'rgba(200,225,240,0.5)' : '#9a968f'; ctx.fillRect(p.x - r, p.y + r * 0.3, r * 2, r * 0.3);
    }
  }

  R.draw = function () {
    const d = R.DPR, S = R.S, t = G.clock;
    OX = OY = 0;
    if (G.shake) { OX = (Math.random() - 0.5) * G.shake; OY = (Math.random() - 0.5) * G.shake; }
    if (G.cutting && G.state === 'play' && G.feedSpeed > 4) { OX += (Math.random() - 0.5) * 0.7; OY += (Math.random() - 0.5) * 0.7; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(table, 0, 0);
    ctx.drawImage(dust, 0, 0);
    if (!G.level) return;

    // Kopan parçalar (sağa sola savrulur, zıplar, kayar)
    for (const w of G.waste) {
      const alpha = w.t < 1.1 ? 1 : Math.max(0, 1 - (w.t - 1.1) / 1.0);
      const sc = 1 + w.z * 0.0035;
      drawBoard(w.cv, w.cv, () => {
        ctx.translate(w.c.x + w.ox, w.c.y + w.oy - w.z * 0.35); ctx.rotate(w.rot); ctx.scale(sc, sc); ctx.translate(-w.c.x, -w.c.y);
        ctx.translate(w.wood.x, w.wood.y); ctx.rotate(w.wood.a);
      }, w.lx0, w.ly0, w.lw, w.lh, alpha, (6 + w.z * 0.25) / S);
    }

    // Ana parça
    drawBoard(W.woodCv, W.shCv, woodXf, -HW, -HH, WW, WH, 1, 7 / S);
    if (G.state === 'paint' || G.state === 'done') {
      setWorld(0, 0); woodXf();
      ctx.globalAlpha = 0.93; ctx.drawImage(Paint.cv, -HW, -HH, WW, WH);
      ctx.globalAlpha = 0.9; ctx.drawImage(Paint.guide, -HW, -HH, WW, WH);
      ctx.globalAlpha = 1;
      // fırça boyutu göstergesi
      if (G.state === 'paint' && Paint.hover && !Paint.dip) {
        ctx.setTransform(d, 0, 0, d, 0, 0);
        ctx.beginPath(); ctx.arc(Paint.hover.x, Paint.hover.y, Paint.SIZES[Paint.size] * S, 0, 6.28);
        ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
      }
    }

    ctx.setTransform(d, 0, 0, d, 0, 0);
    const bx = R.BX, by = R.BY;
    if (G.state === 'play' || G.state === 'intro' || G.state === 'menu') {
      // sapma halkası
      if (G.dev !== null && G.state === 'play') {
        const sd = G.dev;
        const col = sd < -TOL ? '236,125,99' : Math.abs(sd) <= TOL ? '147,212,140' : sd <= 12 ? '241,199,94' : '255,240,220';
        ctx.beginPath(); ctx.arc(bx, by, 13 + Math.sin(t * 20) * 0.8, 0, Math.PI * 2);
        ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(${col},0.75)`; ctx.stroke();
      } else if (G.state === 'play' && !G.st.started) {
        const p = (t * 0.8) % 1;
        ctx.beginPath(); ctx.arc(bx, by, 12 + p * 26, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = `rgba(234,169,92,${0.8 * (1 - p)})`; ctx.stroke();
        ctx.font = '600 13px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,236,210,0.9)';
        ctx.fillText('Testerenin ucu burada — ahşabı ona doğru sürükle', bx, by + 52);
      }
      drawBlade(bx, by, t);
      Particles.draw(ctx, S, bx, by, d);
    }
    Chips.draw(ctx, d);
    ctx.setTransform(d, 0, 0, d, 0, 0);

    if (G.state === 'paint') {
      drawPots(t);
      for (const dr of Paint.drips) { ctx.globalAlpha = 1 - dr.t / 0.5; ctx.fillStyle = dr.c; ctx.beginPath(); ctx.arc(dr.x, dr.y, 2.2, 0, 6.28); ctx.fill(); }
      ctx.globalAlpha = 1;
      drawBrush(t);
      // fırçadaki boya: renk + ad + miktar
      {
        const y = Paint.topY() + 18, w = Math.min(150, R.W * 0.36), x = R.W / 2 - w / 2 + 14;
        ctx.beginPath(); ctx.arc(x - 18, y + 3, 9, 0, 6.28); ctx.fillStyle = Paint.pig ? Paint.css : 'rgba(255,255,255,0.08)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,236,210,0.5)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(ctx, x, y, w, 6, 3); ctx.fill();
        if (Paint.pig) { ctx.fillStyle = Paint.css; roundRect(ctx, x, y, Math.max(6, w * Paint.load), 6, 3); ctx.fill(); }
        ctx.font = '600 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,236,210,0.85)';
        ctx.fillText('Fırça: ' + (Paint.pig ? Paint.colorName(Paint.rgb) : 'temiz'), x, y - 5);
      }
    }

    // yüzen yazılar
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.textAlign = 'center';
    for (const f of G.floaters) {
      const a = 1 - f.t / 1.4;
      ctx.globalAlpha = a; ctx.font = '600 14px system-ui, sans-serif'; ctx.fillStyle = f.color;
      const fx = f.x != null ? f.x : bx + 34, fy = (f.y != null ? f.y : by - 22) - f.dy;
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3; ctx.strokeText(f.text, fx, fy - f.t * 26);
      ctx.fillText(f.text, fx, fy - f.t * 26);
    }
    ctx.globalAlpha = 1;
  };
  return R;
})();

  const swatchesLong = (L) => L.colors.map(i => `<span><i style="background:${PALETTE[i].hex}"></i>${PALETTE[i].name} <span class="eq">= ${recipeText(i)}</span></span>`).join('');

      <div class="kicker">Kıl Testere · ${Shapes.levels.length} bölüm · ★ ${total}</div><h2>Bölümler</h2><p>Kes, boya, teslim et. Sakin ol, talaşın tadını çıkar.</p>
      <h2 style="font-size:19px;margin-top:16px">🖼 Tablolar</h2><p style="margin:0">Çok renkli resimler — renkleri karıştırarak boya. 5. bölümü bitirince açılır.</p><div class="grid">${tablos}</div>
      <h2 style="font-size:19px;margin-top:18px">✂ Şekiller</h2><div class="grid">${shapes}</div>`, true);
    // küçük resimleri parça parça üret (arayüz donmasın)
    const imgs = [...ov.querySelectorAll('img[data-t]')];
    let k = 0;
    (function chunk() {
      if (G.state !== 'menu') return;
      const end = Math.min(imgs.length, k + 6);
      for (; k < end; k++) {
        const L = Shapes.levels[+imgs[k].dataset.t];
        if (!L.thumbUrl) L.thumbUrl = Shapes.thumb(L, 128, 104).toDataURL();
        imgs[k].src = L.thumbUrl;
      }
      if (k < imgs.length) setTimeout(chunk, 0);
    })();
  }

  ov.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    Sound.init(); Sound.tick();
    const a = b.dataset.a;
    if (a === 'start') { hide(); G.state = 'play'; Input.reset(); Sound.setHum(true); }
    else if (a === 'retry') { startLevel(G.li); Render.clearDust(); showIntro(); }
    else if (a === 'next') { startLevel(G.li + 1); Render.clearDust(); showIntro(); }
    else if (a === 'menu') showMenu();
    else if (a === 'back') goBack();
    else if (a === 'level') { startLevel(+b.dataset.i); Render.clearDust(); showIntro(); }
  });

  // Menüden geri: menü açılmadan önceki duruma (oyun / boyama / bölüm kartı) dön
  function goBack() {
    const m = menuReturn || { state: 'intro', html: null };
    menuReturn = null;
    if (m.html) { ov.innerHTML = m.html; ov.classList.add('show'); G.state = m.state; return; }
    if (m.state === 'play' || m.state === 'paint') {
      hide(); G.state = m.state; Input.reset();
      if (m.state === 'play') Sound.setHum(true);
      return;
    }
    showIntro();
  }
  $('bMute').addEventListener('click', () => toggleMute());
  $('bRestart').addEventListener('click', () => { Sound.init(); Sound.tick(); startLevel(G.li); showIntro(); });
  $('bMenu').addEventListener('click', () => { Sound.init(); Sound.tick(); showMenu(); });
  $('bFinish').addEventListener('click', () => { Sound.init(); if (G.state === 'play') finishCut(); else if (G.state === 'paint') finishLevel(); });

  function toggleMute() {
    Sound.init(); Sound.setMuted(!Sound.muted); Store.data.muted = Sound.muted; Store.save();
    $('bMute').textContent = Sound.muted ? '🔇' : '🔊';
  }
  if (Store.data.muted) { Sound.setMuted(true); $('bMute').textContent = '🔇'; }

  function showTimeToast() {
    toast.innerHTML = '<span>🌿 Süre bonusu bitti — acele yok, keyfince devam et.</span><button data-t="go">Devam</button><button data-t="re">Baştan</button>';
    toast.classList.add('show');
  }
  function showPaintToast() {
    clearTimeout(toastTimer);
    toast.innerHTML = '<span>🎨 Boyama zamanı! Fırçayı bir boya kutusuna daldır, sağ üstteki siparişe göre boya.</span>';
    toast.classList.add('show');
    toastTimer = setTimeout(hideToast, 4200);
  }
  toast.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    hideToast();
    if (b.dataset.t === 're') { startLevel(G.li); showIntro(); }
  });
  function hideToast() { toast.classList.remove('show'); }

  function updateHud(force) {
    const now = performance.now();
    if (!force && now - hudT < 100) return;
    hudT = now;
    if (!G.m) return;
    $('lvlNum').textContent = 'Bölüm ' + (G.li + 1);
    $('lvlName').textContent = G.level.name;
    const st = G.st, acc = $('sAcc'), fin = $('bFinish');
    if (G.state === 'paint' || G.state === 'done') {
      const lv = Paint.live;
      $('lbl1').textContent = 'Boyalı'; $('lbl2').textContent = 'Renk';
      $('sProg').textContent = Math.floor(lv.cover * 100) + '%';
      $('sProgBar').style.width = (lv.cover * 100).toFixed(1) + '%';
      const v = lv.correct * 100;
      acc.textContent = Math.round(v) + '%';
      acc.style.color = v >= 85 ? 'var(--good)' : v >= 60 ? 'var(--warn)' : 'var(--bad)';
      $('sTime').textContent = fmt(st.time);
      fin.textContent = 'Teslim Et ✓';
      fin.disabled = G.state !== 'paint';
      fin.classList.toggle('ready', G.state === 'paint' && v >= 85);
      return;
    }
    $('lbl1').textContent = 'İlerleme'; $('lbl2').textContent = 'Doğruluk';
    const prog = Math.max(0, Math.min(1, G.m.progress));
    $('sProg').textContent = Math.floor(prog * 100) + '%';
    $('sProgBar').style.width = (prog * 100).toFixed(1) + '%';
    if (st.lineN > 3) {
      const v = st.lineSum / st.lineN * 100;
      acc.textContent = Math.round(v) + '%';
      acc.style.color = v >= 88 ? 'var(--good)' : v >= 70 ? 'var(--warn)' : 'var(--bad)';
    } else { acc.textContent = '—'; acc.style.color = ''; }
    $('sMoves').textContent = st.cuts;
    const tEl = $('sTime');
    tEl.textContent = fmt(st.time);
    tEl.style.color = st.time > G.level.parTime ? 'var(--warn)' : '';
    fin.textContent = 'Kesimi Bitir ✓';
    fin.disabled = !(G.state === 'play' && prog >= 0.5);
    fin.classList.toggle('ready', G.state === 'play' && prog >= 0.9);
  }
  function enter() {
    const p = ov.classList.contains('show') && ov.querySelector('button.primary');
    if (p) p.click();
    else if (G.state === 'play' && !$('bFinish').disabled) finishCut();
    else if (G.state === 'paint') finishLevel();
  }
  return { back: goBack, showIntro, showResult, showMenu, updateHud, showTimeToast, showPaintToast, hideToast, toggleMute, enter, setGoal, placeGoal };
})();

// ============================== BOOT =================================
function onResize() { Render.resize(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  Render.draw();
  requestAnimationFrame(frame);
}

(function boot() {
  const best = Store.data.best;
  let start = 0; while (best[start] && start < Shapes.levels.length - 1) start++;
  startLevel(start);
  UI.showIntro();
  requestAnimationFrame(frame);
})();

// Test / hata ayıklama kancası (konsoldan erişim)
window.KT = { G, W, Shapes, Paint, startLevel, finishCut, finishLevel, processBlade, toLocal, toWorld, computeResult, checkDetach, sdfAt,
  step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); Render.draw(); },
  // bıçağı yerel (ahşap) koordinatta bir noktaya götürür — otomatik test için
  moveBladeTo(lx, ly) {
    const c = Math.cos(G.wood.a), s = Math.sin(G.wood.a);
    G.wood.x = -(lx * c - ly * s); G.wood.y = -(lx * s + ly * c);
    const bl = toLocal(0, 0); processBlade(G.prevLocal, bl); G.prevLocal = bl;
  } };

/* =====================================================================
   iOS / ANDROID'E TAŞIRKEN DİKKAT EDİLECEKLER
   • touch-action: none (canvas) + pointer olaylarında preventDefault →
     kaydırma, çift dokunma zoom'u ve pull-to-refresh engellenir.
   • viewport-fit=cover + env(safe-area-inset-*) → çentik altında buton kalmaz.
   • AudioContext yalnızca kullanıcı dokunuşundan sonra başlatılır (iOS kuralı).
   • devicePixelRatio en fazla 2. Gölgeler shadowBlur yerine ofsetli çizimle.
   • Ahşap 680×560 piksel maske: her karede yalnızca değişen dikdörtgen
     putImageData ile güncellenir; kopma kontrolü (bileşen etiketleme)
     en fazla ~11 kez/sn ve yalnızca maske değiştiyse çalışır.
   • Haptik: parça koptuğunda navigator.vibrate (Android) çağrılır.
   ===================================================================== */
</script>
</body>
